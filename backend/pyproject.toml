[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aquatrace-backend"
version = "0.1.0"
description = "Hydraulic leak investigation API"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic>=2.10,<3",
  "pydantic-settings>=2.8,<3", "sqlalchemy>=2.0,<2.1", "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2", "redis>=5.2,<7", "httpx>=0.28,<1", "wntr==1.5.0",
  "numpy>=2.2,<3", "scipy>=1.15,<2", "networkx>=3.4,<4", "filelock>=3.17,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires local PostgreSQL and Redis", "slow: hydraulic validation and evaluation"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
