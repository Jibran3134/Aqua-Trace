# Informational CI: shows a red/green check on every push. No branch protection, nothing blocks merging.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # The backend needs PostgreSQL and Redis (see backend/README.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquatrace
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: aquatrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    # Deliberately NO job-level env. The backend's unit tests build
    # Settings(_env_file=None), which still reads OS environment variables, so a
    # job-wide override silently changes what they assert. RATE_LIMIT_ENABLED=false
    # here made test_cache_outage_is_a_miss_but_quota_outage_fails_closed pass a
    # disabled limiter, which returns early instead of raising. Each step below
    # declares only the variables it needs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend

      - name: Run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://aquatrace:ci-not-a-secret@localhost:5432/aquatrace
          MIGRATION_DATABASE_URL: postgresql+psycopg://aquatrace:ci-not-a-secret@localhost:5432/aquatrace
        run: alembic upgrade head

      # Building the signature library runs hundreds of WNTR simulations.
      # Reuse it while the hydraulics inputs are unchanged.
      - uses: actions/cache@v4
        with:
          path: backend/cache
          key: signatures-${{ hashFiles('backend/data/Net3.inp', 'backend/app/core/config.py', 'backend/app/hydraulics/**') }}

      # No env overrides: these assert on the shipped defaults.
      - name: Backend unit tests
        working-directory: backend
        run: python scripts/test.py -q

      - name: Contract + truth-leak checks
        env:
          DATABASE_URL: postgresql+psycopg://aquatrace:ci-not-a-secret@localhost:5432/aquatrace
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: test
          # The sweep creates many scenarios and /scenario/leak is in the
          # "expensive" quota (10 burst, then 0.1/s), so throttling would stall it.
          RATE_LIMIT_ENABLED: "false"
          SIG_WAIT_S: "1500"
          LEAK_SEEDS: "20"
        run: pytest tests/integration -q
