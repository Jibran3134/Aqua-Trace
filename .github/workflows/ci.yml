# Informational CI: shows a red/green check on every push. No branch protection, nothing blocks merging.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # The backend needs PostgreSQL and Redis (see backend/README.md).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquatrace
          POSTGRES_PASSWORD: ci-not-a-secret
          POSTGRES_DB: aquatrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aquatrace:ci-not-a-secret@localhost:5432/aquatrace
      MIGRATION_DATABASE_URL: postgresql+psycopg://aquatrace:ci-not-a-secret@localhost:5432/aquatrace
      REDIS_URL: redis://localhost:6379/0
      # The suite sweeps many seeds; throttling would just make it slow and flaky.
      RATE_LIMIT_ENABLED: "false"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: backend

      - run: alembic upgrade head
        working-directory: backend

      # Building the signature library runs hundreds of WNTR simulations.
      # Reuse it while the hydraulics inputs are unchanged.
      - uses: actions/cache@v4
        with:
          path: backend/cache
          key: signatures-${{ hashFiles('backend/data/Net3.inp', 'backend/app/core/config.py', 'backend/app/hydraulics/**') }}

      - name: Backend unit tests
        working-directory: backend
        run: python scripts/test.py -q

      - name: Contract + truth-leak checks
        env:
          SIG_WAIT_S: "1500"
          LEAK_SEEDS: "20"
        run: pytest tests/integration -q
